services:
  cauterule-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cauterule-demo
    command: demo
    volumes:
      - ./rules:/app/rules
      - ./corpus:/app/corpus
    environment:
      - CAUTERULE_LLM_PROVIDER
      - CAUTERULE_MODEL
      - OPENAI_API_KEY
    healthcheck:
      test: ["CMD-SHELL", "cauterule --help > /dev/null && exit 0 || exit 1"]
      interval: 30s
      retries: 3

  cauterule-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cauterule-test
    entrypoint: ["sh", "-c"]
    command: ["pip install -q pytest && cd /repo && python -m pytest tests/models tests/store tests/serialization tests/injection tests/redaction tests/export tests/cli tests/capture tests/promotion tests/conflict tests/loop tests/packs tests/observe tests/review tests/release tests/benchmark tests/corpus tests/adversarial tests/extraction tests/replay tests/safety tests/test_preflight tests/mcp tests/tui -m 'not slow and not docker' --tb=short -q -p no:cacheprovider"]
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
      - ./rules:/app/rules
      - .:/repo
    environment:
      - CAUTERULE_LLM_PROVIDER
      - CAUTERULE_MODEL
      - OPENAI_API_KEY
    depends_on:
      - cauterule-demo
    healthcheck:
      test: ["CMD-SHELL", "cauterule --help > /dev/null && exit 0 || exit 1"]
      interval: 30s
      retries: 3

  cauterule-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cauterule-mcp
    entrypoint: ["sh", "-c"]
    command: ["pip install -q mcp && exec cauterule mcp --transport stdio"]
    volumes:
      - ./rules:/app/rules
    environment:
      - CAUTERULE_LLM_PROVIDER
      - CAUTERULE_MODEL
      - OPENAI_API_KEY
    depends_on:
      - cauterule-demo
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'cauterule mcp' > /dev/null && exit 0 || exit 1"]
      interval: 30s
      retries: 3
    ports:
      - "8025:8025"