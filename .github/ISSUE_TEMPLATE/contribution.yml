## Certification Checklist (for rule packs)

- [ ] All rules pass linter (no vagueness, tautology, contradiction, unsafe)
- [ ] All rules pass replay on the pack's own corpus
- [ ] Provenance documented (source, author, version)
- [ ] No secrets or PII in trajectories
- [ ] Pack manifest valid

## Acceptance Criteria

- [ ] Contribution reviewed and approved
- [ ] Added to the appropriate directory (`rules/packs/`, `corpus/`, `tests/`)
- [ ] Tests pass with the new contribution
- [ ] Code review passed
- [ ] Lint strict clean
- [ ] Code coverage > 95%
- [ ] All necessary documents updated (CONTRIBUTING.md, corpus guide)

## Exit Gate

- [ ] Code review passed
- [ ] Lint strict clean
- [ ] Code coverage > 95%
- [ ] All necessary documents updated
