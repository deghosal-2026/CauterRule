name: Perf regression

on:
  pull_request:
    branches: [main]

jobs:
  perf-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run benchmarks
        run: pytest benchmarks/ --benchmark-only --benchmark-json .benchmarks/current.json -q -p no:cacheprovider

      - name: Compare against baseline
        run: python scripts/compare_benchmarks.py benchmarks/baseline.json .benchmarks/current.json
